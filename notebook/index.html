<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven-Box Carbon Cycle Model</title>
<style>
  /* Observable Notebook Kit styles (same as Notebooks 2.0); other themes: theme-*.css in its styles folder.
     Light only: the carbon cycle diagram hardcodes white label backgrounds and breaks on dark themes. */
  @import url("@observablehq/notebook-kit/index.css");
  @import url("@observablehq/notebook-kit/theme-air.css");
  @import url("@observablehq/inputs/dist/index.css");
  @import url("@fontsource-variable/inter/wght.css");
  @import url("@fontsource-variable/inter/wght-italic.css");
  @import url("@fontsource-variable/source-serif-4/wght.css");
  @import url("@fontsource-variable/source-serif-4/wght-italic.css");
  @import url("@fontsource-variable/spline-sans-mono/wght.css");
  @import url("@fontsource-variable/spline-sans-mono/wght-italic.css");
</style>
</head>
<body>
<main></main>
<script type="module">
import define from "./ee28ad2bba71cf15.js";
import {Runtime, Library, Inspector} from "@observablehq/runtime";
import * as Inputs from "@observablehq/inputs";

function unnamed(observer) {
  return {
    pending: () => observer.pending(),
    fulfilled: (value) => observer.fulfilled(value),
    rejected: (error) => observer.rejected(error)
  };
}

// The exported notebook defines its cells via main.define(...) without any
// observer, so nothing would be computed or displayed. Attach observers here.
function withObservers(define, container) {
  return (runtime) => {
    const main = runtime.module();
    const views = new Set();
    const cells = new Map();
    const inspector = (name) => {
      const div = container.appendChild(document.createElement("div"));
      div.className = "observablehq--cell";
      if (name) cells.set(name, div);
      return new Inspector(div);
    };
    main.define = function(name, inputs, fn) {
      for (const input of inputs) if (input.startsWith("cell ")) cells.get(input)?.remove(); // import cell: compute, don't show
      if (name.startsWith("viewof$")) views.add(name.slice(7));
      if (views.has(name)) return this.variable(true).define(name, inputs, fn); // value of a viewof: compute, don't show
      if (name.startsWith("cell ")) return this.variable(unnamed(inspector(name))).define(name, inputs, fn); // anonymous cell: hide its label
      return this.variable(inspector(name)).define(name, inputs, fn);
    };
    // The export passes a list of {name, href, mimeType}; Runtime 5 expects a resolver function.
    const fileAttachments = (files) => runtime.fileAttachments((name) => {
      const file = files.find((f) => f.name === name);
      return file && {url: new URL(file.href, import.meta.url).href, mimeType: file.mimeType};
    });
    define(Object.create(runtime, {module: {value: () => main}, fileAttachments: {value: fileAttachments}}));
    return main;
  };
}

// The stdlib loads Inputs from a CDN via its AMD loader, which fails here; use the npm package instead.
const runtime = new Runtime({...new Library(), Inputs: () => Inputs});
runtime.module(withObservers(define, document.querySelector("main")));
</script>
</body>
</html>
